[workspace]
name = "raster-data-tutorial"
description = "Introduction to geospatial raster data processing in Python"
authors = ["Hamed Alemohammad <h.alemohammad@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tasks]
lab = "jupyter lab"

[dependencies]
python = "3.13.*"
jupyterlab = "4.6.4.*"
pystac-client = "0.9.0.*"
planetary-computer = "1.0.0.*"
leafmap = "0.63.1.*"
matplotlib = "*"
dask = "2026.8.0.*"
dask-labextension = "*"
distributed = "2026.8.0.*"
rioxarray = "0.23.0.*"
rasterio = "*"
xarray = "*"
numpy = "*"
shapely = "*"
pyproj = "*"
requests = "*"
tqdm = "*"
